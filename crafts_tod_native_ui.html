<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRAFTS Manual RFI Mask</title>
<style>
:root{color-scheme:dark;--bg:#0b1016;--panel:#121a24;--line:#263547;--text:#e8eef6;--muted:#91a3b7;--accent:#57c7ff;--manual:#ff3d66;--auto:#ff8a1e;--invalid:#6c747e;--good:#4bd79b;--warn:#ffc857}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px/1.35 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;overflow:hidden}button,select{font:inherit;color:inherit;background:#172332;border:1px solid #31445b;border-radius:6px;padding:6px 10px;cursor:pointer}button:hover{border-color:#6b91ba}button.active{background:#174b68;border-color:var(--accent);box-shadow:0 0 0 1px #57c7ff55 inset}button.primary{background:#176d55;border-color:#37b88b}button:disabled{opacity:.45;cursor:not-allowed}header{height:50px;display:flex;align-items:center;gap:12px;padding:7px 12px;border-bottom:1px solid var(--line);background:#0f1721}.brand{font-weight:720;letter-spacing:.2px}.badge{padding:3px 8px;border-radius:999px;background:#233142;color:var(--muted)}.badge.ready{background:#153d32;color:#7ee7ba}.badge.loading,.badge.saving{background:#4a3918;color:#ffd978}.spacer{flex:1}.group{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.layout{height:calc(100vh - 50px);display:grid;grid-template-columns:minmax(650px,1fr) 300px}.main{min-width:0;display:grid;grid-template-rows:auto minmax(0,1fr) 185px;gap:8px;padding:9px}.toolbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.sep{width:1px;height:25px;background:var(--line);margin:0 3px}.check{display:flex;gap:5px;align-items:center;color:var(--muted);white-space:nowrap}.plots{display:grid;grid-template-rows:1fr 1fr;gap:8px;min-height:0}.plot,.spectrum{position:relative;border:1px solid var(--line);border-radius:8px;background:#0a0f15;overflow:hidden}.plot canvas,.spectrum canvas{width:100%;height:100%;display:block}.plot-title{position:absolute;top:5px;left:67px;background:#0a0f15bb;padding:2px 6px;border-radius:4px;pointer-events:none}.hint{position:absolute;right:8px;top:6px;color:var(--muted);background:#0a0f15bb;padding:2px 5px;border-radius:4px;pointer-events:none}.side{border-left:1px solid var(--line);background:var(--panel);display:grid;grid-template-rows:auto auto minmax(0,1fr);min-height:0}.side section{padding:11px;border-bottom:1px solid var(--line)}.status{color:var(--muted);margin-top:7px}.legend{display:grid;grid-template-columns:12px 1fr;gap:6px 8px;color:var(--muted)}.swatch{height:12px;border-radius:2px}.log{padding:10px;overflow:auto;font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:#aebed0;white-space:pre-wrap}.coord{font-variant-numeric:tabular-nums;color:var(--accent)}.loading-cover{position:absolute;inset:0;display:grid;place-items:center;background:#0b1016dd;z-index:4}.loading-cover[hidden]{display:none}.spinner{width:28px;height:28px;border:3px solid #294057;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:auto auto 8px}@keyframes spin{to{transform:rotate(360deg)}}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#192536;border:1px solid #44617f;border-radius:7px;padding:8px 13px;z-index:10;box-shadow:0 8px 30px #0008}.toast.error{border-color:#b54a5f;color:#ff9db0}@media(max-width:980px){.layout{grid-template-columns:1fr}.side{display:none}.main{grid-template-rows:auto minmax(0,1fr) 150px}.brand{display:none}}
.plots{grid-template-rows:repeat(2,minmax(310px,38vh))}
.plot,.spectrum{min-height:0}
.plot canvas,.spectrum canvas{position:absolute;inset:0}
body{overflow:auto}
header{position:sticky;top:0;z-index:8}
.layout{height:auto;min-height:calc(100vh - 50px)}
.main{grid-template-rows:auto auto 220px}
.spectrum{height:220px}
.spectrum canvas{cursor:crosshair}
.rfi-width{min-width:95px;text-align:center;color:var(--muted)}
.image-scale{min-width:72px;text-align:center;color:var(--muted)}
.view-choice{display:flex;align-items:center;gap:5px;color:var(--muted);white-space:nowrap}.view-choice select{min-width:118px}.view-choice #beamSelect{min-width:72px}
.modal-backdrop{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#05080dbb;padding:20px}.modal-backdrop[hidden]{display:none}.save-dialog{width:min(620px,94vw);max-height:88vh;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:12px;padding:18px;background:#121a24;border:1px solid #3b526c;border-radius:10px;box-shadow:0 20px 70px #000b}.save-dialog h2{font-size:18px;margin:0}.save-dialog p{margin:0;color:var(--muted)}.save-table-wrap{overflow:auto;border:1px solid var(--line);border-radius:7px}.save-table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}.save-table th,.save-table td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:right}.save-table th:first-child,.save-table td:first-child{text-align:left}.save-table tr:last-child td{border-bottom:0}.dialog-actions{display:flex;justify-content:flex-end;gap:8px}
.side{position:sticky;top:50px;height:calc(100vh - 50px)}
</style>
</head>
<body>
<header><div class="brand">CRAFTS Manual RFI Mask</div><span id="badge" class="badge loading">starting</span><div id="group" class="group">等待服务器…</div><div class="spacer"></div><span class="coord" id="coord">—</span></header>
<div class="layout"><main class="main">
<div class="toolbar">
  <label class="view-choice">查看 <select id="viewMode"><option value="mean">19-beam Mean</option><option value="single">Single beam</option></select><select id="beamSelect" aria-label="选择单个 beam" hidden></select></label><span class="sep"></span>
  <button data-mode="frequency" class="active">频率 F</button><button data-mode="time">时间 T</button><button data-mode="box">矩形 B</button><button data-mode="delete">删除 D</button><button data-mode="pan">平移 G</button><span class="sep"></span>
  <button id="undo">撤销 U</button><button id="revert">恢复已保存</button><button id="contrast">对比度 1/4</button><button id="colorAuto" title="清除 Pol0/Pol1 手动色标范围">色标自动</button><button id="dpiDown" title="降低瀑布图传输分辨率，提高响应速度">DPI −</button><span id="dpiScale" class="image-scale">DPI 1×</span><button id="dpiUp" title="提高瀑布图传输分辨率，增强细节">DPI ＋</button><button id="rfiThin" title="减小自动 RFI 显示宽度">RFI −</button><span id="rfiWidth" class="rfi-width">宽度 3 px</span><button id="rfiThick" title="增加自动 RFI 显示宽度">RFI ＋</button><label class="view-choice" title="选择 Mean Spectrum 的 Y 轴显示范围">Y轴 <select id="spectrumY" aria-label="Mean Spectrum Y轴范围"><option value="strong">强抗RFI</option><option value="robust">抗RFI</option><option value="percentile">99%数据</option><option value="full">完整范围</option></select></label><button id="reset">重置视图 0</button><span class="sep"></span>
  <button id="prev">上一个</button><button id="next">下一个</button><button id="save" class="primary">保存 S</button>
  <label class="check"><input id="both" type="checkbox">双偏振</label><label class="check"><input id="applyAuto" type="checkbox" checked>应用自动 RFI</label><label class="check"><input id="showAuto" type="checkbox" checked>显示自动 RFI</label>
</div>
<div class="plots"><div class="plot"><canvas id="pol0"></canvas><div id="plotTitle0" class="plot-title">Pol 0 · 19-beam Mean</div><div class="hint">Option+滚轮：频率 · Shift+滚轮：时间 · 拖色标箭头：亮度范围</div><div class="loading-cover" id="cover0"><div><div class="spinner"></div><span>载入数据…</span></div></div></div><div class="plot"><canvas id="pol1"></canvas><div id="plotTitle1" class="plot-title">Pol 1 · 19-beam Mean</div><div class="loading-cover" id="cover1"><div><div class="spinner"></div><span>载入数据…</span></div></div></div></div>
<div class="spectrum"><canvas id="spectrum"></canvas></div>
</main><aside class="side"><section><strong>当前任务</strong><div id="summary" class="status">连接服务器中…</div></section><section><div class="legend"><span class="swatch" style="background:var(--manual)"></span><span>手动 mask（仅此内容会保存）</span><span class="swatch" style="background:var(--auto)"></span><span>OneChannel ∪ SAT1380 自动 mask</span><span class="swatch" style="background:var(--invalid)"></span><span>19 beams 均无有效值（NaN，不是负值）</span></div></section><div id="log" class="log"></div></aside></div>
<div id="saveConfirm" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="saveTitle" hidden><div class="save-dialog"><h2 id="saveTitle">确认保存 manual mask</h2><p id="saveExplanation"></p><div class="save-table-wrap"><table class="save-table"><thead><tr><th>编辑层</th><th>Pol0</th><th>Pol1</th><th>合计</th></tr></thead><tbody id="saveRows"></tbody></table></div><div class="dialog-actions"><button id="cancelSave">取消</button><button id="confirmSave" class="primary">确认并保存</button></div></div></div>
<script>
'use strict';
const $=s=>document.querySelector(s), canvases=[$('#pol0'),$('#pol1')], PAD={l:62,r:74,t:23,b:27};
const IMAGE_SCALES=[.5,.75,1,1.25,1.5,2,3,4];
const SPECTRUM_Y_LABELS={strong:'强抗RFI',robust:'抗RFI',percentile:'99%数据',full:'完整范围'};
const app={state:null,mode:'frequency',contrast:0,autoWidth:1,imageScaleIndex:2,spectrumYMode:'strong',view:null,drag:null,colorDrag:null,colorRanges:[null,null],autoLimits:[[0,1],[0,1]],renderSeq:0,spectrumRevision:-1,images:[null,null],limits:[[0,1],[0,1]],spectrumData:null,referenceFrequency:null};
for(let beam=1;beam<=19;beam++){const option=document.createElement('option');option.value=`M${String(beam).padStart(2,'0')}`;option.textContent=option.value;$('#beamSelect').appendChild(option)}
function toast(msg,error=false){const d=document.createElement('div');d.className='toast'+(error?' error':'');d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}
function nice(v,n=3){return Number(v).toFixed(n)}
function fitCanvas(c){const dpr=Math.min(devicePixelRatio||1,2),r=c.getBoundingClientRect(),w=Math.max(1,Math.floor(r.width*dpr)),h=Math.max(1,Math.floor(r.height*dpr));if(c.width!==w||c.height!==h){c.width=w;c.height=h}return {ctx:c.getContext('2d'),w,h,dpr}}
function plotRect(c){const {w,h,dpr}=fitCanvas(c);return{x:PAD.l*dpr,y:PAD.t*dpr,w:w-(PAD.l+PAD.r)*dpr,h:h-(PAD.t+PAD.b)*dpr,dpr}}
function dataAt(c,event){const r=c.getBoundingClientRect(),p=plotRect(c),sx=c.width/r.width,sy=c.height/r.height,x=(event.clientX-r.left)*sx,y=(event.clientY-r.top)*sy;return{f:app.view.f0+(x-p.x)/p.w*(app.view.f1-app.view.f0),t:app.view.t1-(y-p.y)/p.h*(app.view.t1-app.view.t0),inside:x>=p.x&&x<=p.x+p.w&&y>=p.y&&y<=p.y+p.h,x,y}}
function xy(c,f,t){const p=plotRect(c);return{x:p.x+(f-app.view.f0)/(app.view.f1-app.view.f0)*p.w,y:p.y+(app.view.t1-t)/(app.view.t1-app.view.t0)*p.h}}
function drawAxes(c,ctx,p,pol){ctx.strokeStyle='#304257';ctx.lineWidth=p.dpr;ctx.strokeRect(p.x,p.y,p.w,p.h);ctx.font=`${11*p.dpr}px system-ui`;ctx.fillStyle='#90a4b9';ctx.textAlign='center';ctx.textBaseline='top';for(let i=0;i<=5;i++){const x=p.x+p.w*i/5,f=app.view.f0+(app.view.f1-app.view.f0)*i/5;ctx.beginPath();ctx.moveTo(x,p.y+p.h);ctx.lineTo(x,p.y+p.h+4*p.dpr);ctx.stroke();ctx.fillText(nice(f,1),x,p.y+p.h+6*p.dpr)}ctx.textAlign='right';ctx.textBaseline='middle';for(let i=0;i<=4;i++){const y=p.y+p.h*i/4,t=app.view.t1-(app.view.t1-app.view.t0)*i/4;ctx.fillText(String(Math.round(t)),p.x-7*p.dpr,y)}ctx.save();ctx.translate(14*p.dpr,p.y+p.h/2);ctx.rotate(-Math.PI/2);ctx.textAlign='center';ctx.fillText('Record',0,0);ctx.restore();if(pol===1){ctx.textAlign='center';ctx.textBaseline='bottom';ctx.fillText('Frequency (MHz)',p.x+p.w/2,c.height-1*p.dpr)}}
function colorbarValues(pol){const base=app.autoLimits[pol],selected=app.colorRanges[pol]||app.limits[pol];return{base,selected}}
function colorbarY(p,value,base){const span=base[1]-base[0]||1;return p.y+(base[1]-value)/span*p.h}
function drawColorbar(ctx,p,pol){const x=p.x+p.w+13*p.dpr,w=12*p.dpr,g=ctx.createLinearGradient(0,p.y+p.h,0,p.y);g.addColorStop(0,'rgb(68,1,84)');g.addColorStop(.25,'rgb(59,82,139)');g.addColorStop(.5,'rgb(33,145,140)');g.addColorStop(.75,'rgb(92,200,99)');g.addColorStop(1,'rgb(253,231,37)');ctx.fillStyle=g;ctx.fillRect(x,p.y,w,p.h);ctx.strokeStyle='#536980';ctx.strokeRect(x,p.y,w,p.h);const {base,selected}=colorbarValues(pol),[lo,hi]=selected,mid=(lo+hi)/2;ctx.fillStyle='#91a3b7';ctx.font=`${10*p.dpr}px system-ui`;ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(nice(hi,3),x+w+5*p.dpr,p.y);ctx.fillText(nice(mid,3),x+w+5*p.dpr,p.y+p.h/2);ctx.fillText(nice(lo,3),x+w+5*p.dpr,p.y+p.h);ctx.textBaseline='top';ctx.fillText('K',x,p.y+3*p.dpr);for(const [value,color] of [[hi,'#fff2a8'],[lo,'#7edcff']]){const y=Math.max(p.y,Math.min(p.y+p.h,colorbarY(p,value,base)));ctx.beginPath();ctx.moveTo(x-2*p.dpr,y);ctx.lineTo(x-11*p.dpr,y-6*p.dpr);ctx.lineTo(x-11*p.dpr,y+6*p.dpr);ctx.closePath();ctx.fillStyle=color;ctx.fill();ctx.strokeStyle='#071018';ctx.lineWidth=p.dpr;ctx.stroke()}}
function colorbarHit(c,event,pol){const r=c.getBoundingClientRect(),p=plotRect(c),sx=c.width/r.width,sy=c.height/r.height,x=(event.clientX-r.left)*sx,y=(event.clientY-r.top)*sy,barX=p.x+p.w+13*p.dpr,barW=12*p.dpr;if(x<barX-15*p.dpr||x>barX+barW+3*p.dpr||y<p.y-8*p.dpr||y>p.y+p.h+8*p.dpr)return null;const {base,selected}=colorbarValues(pol),loY=colorbarY(p,selected[0],base),hiY=colorbarY(p,selected[1],base);return{handle:Math.abs(y-loY)<Math.abs(y-hiY)?'lo':'hi',base:[...base]}}
function activeManualLayers(pol){const layers=[app.state.document.polarizations[pol]];if(app.state.view_mode==='single'){const specific=app.state.document.beam_polarizations?.[app.state.selected_beam]?.[pol];if(specific)layers.push(specific)}return layers}
function drawManual(c,ctx,p,pol){ctx.save();ctx.beginPath();ctx.rect(p.x,p.y,p.w,p.h);ctx.clip();ctx.fillStyle='#ff3d6670';ctx.strokeStyle='#ff7690';ctx.lineWidth=p.dpr;for(const m of activeManualLayers(pol)){for(const [a,b] of m.frequency_ranges_mhz){const q0=xy(c,a,app.view.t0),q1=xy(c,b,app.view.t1);ctx.fillRect(q0.x,p.y,q1.x-q0.x,p.h)}for(const [a,b] of m.time_ranges_records){const q0=xy(c,app.view.f0,a),q1=xy(c,app.view.f1,b);ctx.fillRect(p.x,q1.y,p.w,q0.y-q1.y)}for(const box of m.boxes){const [a,b]=box.frequency_mhz,[u,v]=box.records,q0=xy(c,a,u),q1=xy(c,b,v);ctx.fillRect(q0.x,q1.y,q1.x-q0.x,q0.y-q1.y);ctx.strokeRect(q0.x,q1.y,q1.x-q0.x,q0.y-q1.y)}}if(app.drag&&app.drag.pol===pol&&app.drag.now){const a=app.drag.start,b=app.drag.now;ctx.fillStyle='#ffffff22';ctx.strokeStyle='#fff';ctx.setLineDash([5*p.dpr,4*p.dpr]);ctx.fillRect(Math.min(a.x,b.x),Math.min(a.y,b.y),Math.abs(a.x-b.x),Math.abs(a.y-b.y));ctx.strokeRect(Math.min(a.x,b.x),Math.min(a.y,b.y),Math.abs(a.x-b.x),Math.abs(a.y-b.y))}ctx.restore()}
function drawReference(ctx,p,showLabel=true){const f=app.referenceFrequency;if(f===null||f<app.view.f0||f>app.view.f1)return;const x=p.x+(f-app.view.f0)/(app.view.f1-app.view.f0)*p.w;ctx.save();ctx.beginPath();ctx.strokeStyle='#ff334f';ctx.lineWidth=1.4*p.dpr;ctx.setLineDash([6*p.dpr,4*p.dpr]);ctx.moveTo(x,p.y);ctx.lineTo(x,p.y+p.h);ctx.stroke();ctx.setLineDash([]);if(showLabel){const label=`${nice(f,4)} MHz`,labelX=Math.min(x+5*p.dpr,p.x+p.w-88*p.dpr);ctx.font=`${11*p.dpr}px system-ui`;ctx.textAlign='left';ctx.textBaseline='top';ctx.fillStyle='#ff334f';ctx.fillRect(labelX-3*p.dpr,p.y+4*p.dpr,87*p.dpr,17*p.dpr);ctx.fillStyle='#fff';ctx.fillText(label,labelX,p.y+6*p.dpr)}ctx.restore()}
function drawPanel(pol){const c=canvases[pol],{ctx}=fitCanvas(c),p=plotRect(c);ctx.fillStyle='#090e14';ctx.fillRect(0,0,c.width,c.height);ctx.imageSmoothingEnabled=false;if(app.images[pol])ctx.drawImage(app.images[pol],p.x,p.y,p.w,p.h);drawAxes(c,ctx,p,pol);drawColorbar(ctx,p,pol);drawManual(c,ctx,p,pol);drawReference(ctx,p,true)}
async function renderPanel(pol,seq){const c=canvases[pol],p=plotRect(c),u=new URL('/api/view.jpg',location.origin),imageScale=IMAGE_SCALES[app.imageScaleIndex],params={pol,f0:app.view.f0,f1:app.view.f1,t0:app.view.t0,t1:app.view.t1,width:Math.round(p.w/p.dpr*imageScale),height:Math.round(p.h/p.dpr*imageScale),contrast:app.contrast,auto_width:app.autoWidth,apply_auto:+$('#applyAuto').checked,show_auto:+$('#showAuto').checked,view_mode:$('#viewMode').value,beam:$('#beamSelect').value};if(app.colorRanges[pol]){params.vmin=app.colorRanges[pol][0];params.vmax=app.colorRanges[pol][1]}Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));try{const response=await fetch(u);if(!response.ok)throw Error(response.statusText);const low=Number(response.headers.get('X-Color-Low')),high=Number(response.headers.get('X-Color-High')),autoLow=Number(response.headers.get('X-Auto-Color-Low')),autoHigh=Number(response.headers.get('X-Auto-Color-High')),blob=await response.blob();if(seq!==app.renderSeq)return;app.limits[pol]=[low,high];if(Number.isFinite(autoLow)&&Number.isFinite(autoHigh)&&autoHigh>autoLow)app.autoLimits[pol]=[autoLow,autoHigh];app.images[pol]=await createImageBitmap(blob);drawPanel(pol)}catch(e){const {ctx}=fitCanvas(c);ctx.fillStyle='#ff8da1';ctx.fillText('图像请求失败: '+e.message,p.x+10,p.y+20)}}
function redrawOverlays(){canvases.forEach((_,pol)=>drawPanel(pol))}
async function renderAll(){const seq=++app.renderSeq;await Promise.all([renderPanel(0,seq),renderPanel(1,seq)])}
function spectrumTick(v){const a=Math.abs(v);return a>=10000||a>0&&a<.01?v.toExponential(1):a>=100?v.toFixed(0):a>=10?v.toFixed(1):v.toFixed(2)}
function quantile(sorted,q){if(sorted.length===1)return sorted[0];const position=(sorted.length-1)*q,index=Math.floor(position),fraction=position-index;return sorted[index]+(sorted[Math.min(index+1,sorted.length-1)]-sorted[index])*fraction}
function spectrumYLimits(sorted,mode){let lo,hi;if(mode==='full'){lo=sorted[0];hi=sorted[sorted.length-1]}else if(mode==='percentile'){lo=quantile(sorted,.005);hi=quantile(sorted,.995)}else{const q1=quantile(sorted,.25),q3=quantile(sorted,.75),iqr=q3-q1,strong=mode==='strong',fence=strong?1.5:2.5,tail=strong?.02:.01;lo=Math.max(quantile(sorted,tail),q1-fence*iqr);hi=Math.min(quantile(sorted,1-tail),q3+fence*iqr)}if(!(hi>lo)){const centre=Number.isFinite(lo)?lo:0,span=Math.max(1,Math.abs(centre)*.05);return[centre-span,centre+span]}const margin=(hi-lo)*.08;return[lo-margin,hi+margin]}
function drawSpectrumAxis(ctx,p,h,lo=null,hi=null){ctx.strokeStyle='#304257';ctx.lineWidth=p.dpr;ctx.strokeRect(p.x,p.y,p.w,p.h);ctx.font=`${11*p.dpr}px system-ui`;ctx.fillStyle='#91a3b7';ctx.textAlign='center';ctx.textBaseline='top';for(let i=0;i<=5;i++){const x=p.x+p.w*i/5,f=app.view.f0+(app.view.f1-app.view.f0)*i/5;ctx.beginPath();ctx.moveTo(x,p.y);ctx.lineTo(x,p.y+p.h);ctx.strokeStyle=i===0||i===5?'#304257':'#1b2837';ctx.stroke();ctx.fillText(nice(f,1),x,p.y+p.h+5*p.dpr)}if(lo!==null&&hi!==null){ctx.textAlign='right';ctx.textBaseline='middle';for(let i=0;i<=4;i++){const y=p.y+p.h*i/4,v=hi-(hi-lo)*i/4;ctx.fillText(spectrumTick(v),p.x-7*p.dpr,y)}ctx.save();ctx.translate(13*p.dpr,p.y+p.h/2);ctx.rotate(-Math.PI/2);ctx.textAlign='center';ctx.fillText('Mean (K)',0,0);ctx.restore()}ctx.textAlign='center';ctx.textBaseline='bottom';ctx.fillText('Frequency (MHz)',p.x+p.w/2,h-1*p.dpr)}
function drawSpectrum(data){app.spectrumData=data;const c=$('#spectrum'),{ctx,w,h,dpr}=fitCanvas(c),p={x:PAD.l*dpr,y:21*dpr,w:w-(PAD.l+PAD.r)*dpr,h:h-47*dpr,dpr};ctx.fillStyle='#090e14';ctx.fillRect(0,0,w,h);if(!data.frequency.length){drawSpectrumAxis(ctx,p,h);ctx.fillStyle='#91a3b7';ctx.fillText(`${data.view_label||'当前视图'}频谱后台计算中…`,p.x+10,p.y+20);return}let vals=[];for(let i=0;i<data.frequency.length;i++){const f=data.frequency[i];if(f<app.view.f0||f>app.view.f1)continue;if(Number.isFinite(data.pol0[i]))vals.push(data.pol0[i]);if(Number.isFinite(data.pol1[i]))vals.push(data.pol1[i])}if(!vals.length){drawSpectrumAxis(ctx,p,h);return}vals.sort((a,b)=>a-b);const yMode=app.spectrumYMode,[lo,hi]=spectrumYLimits(vals,yMode);drawSpectrumAxis(ctx,p,h,lo,hi);const line=(arr,color)=>{ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=1.1*dpr;let started=false;for(let i=0;i<data.frequency.length;i++){const f=data.frequency[i],v=arr[i];if(f<app.view.f0||f>app.view.f1)continue;if(!Number.isFinite(v)){started=false;continue}const x=p.x+(f-app.view.f0)/(app.view.f1-app.view.f0)*p.w,y=p.y+(hi-v)/(hi-lo)*p.h;if(!started){ctx.moveTo(x,y);started=true}else ctx.lineTo(x,y)}ctx.stroke()};ctx.save();ctx.beginPath();ctx.rect(p.x,p.y,p.w,p.h);ctx.clip();line(data.pol0,'#57c7ff');line(data.pol1,'#ffb15b');ctx.restore();drawReference(ctx,p,true);ctx.font=`${11*dpr}px system-ui`;ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.fillStyle=data.apply_auto?'#ffb15b':'#91a3b7';const mode=data.apply_auto?'已应用自动 RFI + 手动 mask':'未应用自动 RFI（手动 mask 仍生效）';ctx.fillText(`${data.view_label} Mean · ${mode} · Y轴 ${SPECTRUM_Y_LABELS[yMode]} · Pol0 蓝 / Pol1 橙`,p.x+5,14*dpr)}
async function pollSpectrum(force=false){if(!app.state?.ready)return;const requested=$('#applyAuto').checked,params=new URLSearchParams({apply_auto:+requested,view_mode:$('#viewMode').value,beam:$('#beamSelect').value}),d=await fetch(`/api/spectrum?${params}`).then(r=>r.json());if(Boolean(d.apply_auto)!==$('#applyAuto').checked||d.view_mode!==$('#viewMode').value||(d.view_mode==='single'&&d.view_label!==$('#beamSelect').value))return;if(force||d.revision!==app.spectrumRevision||app.spectrumData?.apply_auto!==d.apply_auto||app.spectrumData?.view_label!==d.view_label){app.spectrumRevision=d.revision;drawSpectrum(d)}}
function applyState(s,initial=false){const prior=app.state;app.state=s;$('#badge').textContent=s.phase;$('#badge').className='badge '+s.phase;$('#group').textContent=`${s.group.scan}:${s.group.serial} · ${s.group.beams.length}/19 beams · ${s.dirty?'未保存':'已保存/未修改'}`;if(s.view_mode){$('#viewMode').value=s.view_mode;$('#beamSelect').hidden=s.view_mode!=='single';if(s.selected_beam)$('#beamSelect').value=s.selected_beam}const viewLabel=s.view_mode==='single'?s.selected_beam:'19-beam Mean';$('#plotTitle0').textContent=`Pol 0 · ${viewLabel}`;$('#plotTitle1').textContent=`Pol 1 · ${viewLabel}`;$('#summary').innerHTML=`视图 ${viewLabel}<br>尺寸 ${s.shape[0]||'—'} × ${s.shape[1]||'—'}<br>OneChannel ${s.auto_available.one_channel??0}/19<br>SAT1380 ${s.auto_available.sat1380??0}/19<br>${s.message}`;$('#log').textContent=s.logs.map(x=>`${x.time}  ${x.message}`).join('\n');$('#log').scrollTop=$('#log').scrollHeight;document.querySelectorAll('.loading-cover').forEach(cover=>cover.hidden=s.ready);document.querySelectorAll('button,select').forEach(b=>b.disabled=s.busy&&b.id!=='reset');if(s.ready&&(!app.view||initial||!prior?.ready||prior.group.key!==s.group.key)){app.view={f0:s.frequency_range[0],f1:s.frequency_range[1],t0:0,t1:s.shape[0]};renderAll()}else if(s.ready&&prior&&prior.revision!==s.revision){renderAll()}if(s.spectrum_revision!==app.spectrumRevision)pollSpectrum()}
async function poll(){try{const s=await fetch('/api/state',{cache:'no-store'}).then(r=>r.json());applyState(s,!app.state)}catch(e){$('#badge').textContent='disconnected'}setTimeout(poll,700)}
async function action(payload){try{const r=await fetch('/api/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),d=await r.json();if(!r.ok)throw Error(d.error||r.statusText);applyState(d.state);return d}catch(e){toast(e.message,true);throw e}}
function setMode(mode){app.mode=mode;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode))}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
async function changeDataView(){const viewMode=$('#viewMode').value,beam=$('#beamSelect').value;$('#beamSelect').hidden=viewMode!=='single';app.colorRanges=[null,null];document.querySelectorAll('.loading-cover').forEach(cover=>cover.hidden=false);try{await action({action:'set_view',view_mode:viewMode,beam});app.spectrumRevision=-1;await renderAll();await pollSpectrum(true)}catch(e){document.querySelectorAll('.loading-cover').forEach(cover=>cover.hidden=app.state?.ready)}}
$('#viewMode').onchange=()=>changeDataView();
$('#beamSelect').onchange=()=>changeDataView();
for(const [id,act] of [['undo','undo'],['revert','revert'],['prev','previous'],['next','next']])$('#'+id).onclick=()=>action({action:act});
function appendSaveRow(label,counts){const row=document.createElement('tr');for(const value of [label,counts.pol0,counts.pol1,counts.total]){const cell=document.createElement('td');cell.textContent=value;row.appendChild(cell)}$('#saveRows').appendChild(row)}
function showSaveConfirmation(summary){$('#saveRows').replaceChildren();appendSaveRow('Mean 公共层',summary.mean);for(const [beam,counts] of Object.entries(summary.beams))appendSaveRow(`${beam} 专属层`,counts);$('#saveExplanation').textContent=`nfile ${app.state.group.serial} 将生成 19 个逐-beam NPZ；每个最终 mask = Mean 公共层 ∪ 对应 beam 专属层。以下为归一化后的有效区域数，请确认。`;$('#saveConfirm').hidden=false;$('#confirmSave').focus()}
$('#save').onclick=async()=>{const d=await action({action:'save_summary'});showSaveConfirmation(d.summary)};
$('#cancelSave').onclick=()=>{$('#saveConfirm').hidden=true};
$('#confirmSave').onclick=async()=>{const button=$('#confirmSave');button.disabled=true;button.textContent='正在保存…';try{const d=await action({action:'save'});$('#saveConfirm').hidden=true;toast(`已保存 JSON + ${Math.max(0,d.paths.length-1)} 个 beam NPZ`)}finally{button.disabled=false;button.textContent='确认并保存'}};
$('#contrast').onclick=()=>{app.contrast=(app.contrast+1)%4;app.colorRanges=[null,null];$('#contrast').textContent=`对比度 ${app.contrast+1}/4`;renderAll()};
$('#colorAuto').onclick=()=>{app.colorRanges=[null,null];renderAll()};
function changeImageScale(delta){app.imageScaleIndex=Math.max(0,Math.min(IMAGE_SCALES.length-1,app.imageScaleIndex+delta));const scale=IMAGE_SCALES[app.imageScaleIndex];$('#dpiScale').textContent=`DPI ${scale.toFixed(2).replace(/\.?0+$/,'')}×`;$('#dpiDown').disabled=app.imageScaleIndex===0;$('#dpiUp').disabled=app.imageScaleIndex===IMAGE_SCALES.length-1;renderAll()}
$('#dpiDown').onclick=()=>changeImageScale(-1);
$('#dpiUp').onclick=()=>changeImageScale(1);
function changeAutoWidth(delta){app.autoWidth=Math.max(0,Math.min(4,app.autoWidth+delta));$('#rfiWidth').textContent=`宽度 ${2*app.autoWidth+1} px（1–9）`;$('#rfiThin').disabled=app.autoWidth===0;$('#rfiThick').disabled=app.autoWidth===4;renderAll()}
$('#rfiThin').onclick=()=>changeAutoWidth(-1);
$('#rfiThick').onclick=()=>changeAutoWidth(1);
$('#spectrumY').onchange=()=>{app.spectrumYMode=$('#spectrumY').value;if(app.spectrumData)drawSpectrum(app.spectrumData)};
$('#reset').onclick=()=>{if(!app.state?.ready)return;app.view={f0:app.state.frequency_range[0],f1:app.state.frequency_range[1],t0:0,t1:app.state.shape[0]};renderAll();pollSpectrum()};
$('#applyAuto').onchange=()=>{renderAll();pollSpectrum(true)};
$('#showAuto').onchange=()=>renderAll();
function updateColorDrag(c,event,pol){const drag=app.colorDrag;if(!drag||drag.pol!==pol)return false;const r=c.getBoundingClientRect(),p=plotRect(c),y=(event.clientY-r.top)*c.height/r.height,base=drag.base,span=base[1]-base[0],value=Math.max(base[0],Math.min(base[1],base[1]-(y-p.y)/p.h*span)),range=[...(app.colorRanges[pol]||app.limits[pol])],gap=Math.max(span*.005,Number.EPSILON);if(drag.handle==='lo')range[0]=Math.min(value,range[1]-gap);else range[1]=Math.max(value,range[0]+gap);app.colorRanges[pol]=range;$('#coord').textContent=`Pol${pol} 色标 ${nice(range[0],3)} – ${nice(range[1],3)} K`;drawPanel(pol);return true}
canvases.forEach((c,pol)=>{
  c.addEventListener('pointerdown',e=>{if(!app.state?.ready)return;const colorHit=colorbarHit(c,e,pol);if(colorHit){c.setPointerCapture(e.pointerId);app.colorRanges[pol]=[...(app.colorRanges[pol]||app.limits[pol])];app.colorDrag={pol,handle:colorHit.handle,base:colorHit.base};updateColorDrag(c,e,pol);return}const d=dataAt(c,e);if(!d.inside)return;c.setPointerCapture(e.pointerId);app.drag={pol,start:d,now:d,base:{...app.view}}});
  c.addEventListener('pointermove',e=>{if(updateColorDrag(c,e,pol))return;const colorHit=colorbarHit(c,e,pol);c.style.cursor=colorHit?'ns-resize':'crosshair';const d=dataAt(c,e);if(d.inside)$('#coord').textContent=`${nice(d.f,4)} MHz · record ${Math.round(d.t)}`;if(!app.drag)return;app.drag.now=d;if(app.mode==='pan'){const df=(app.drag.start.x-d.x)/plotRect(c).w*(app.drag.base.f1-app.drag.base.f0),dt=(d.y-app.drag.start.y)/plotRect(c).h*(app.drag.base.t1-app.drag.base.t0);app.view={f0:app.drag.base.f0+df,f1:app.drag.base.f1+df,t0:app.drag.base.t0+dt,t1:app.drag.base.t1+dt};clampView()}else redrawOverlays()});
  c.addEventListener('pointerup',async e=>{if(app.colorDrag?.pol===pol){updateColorDrag(c,e,pol);app.colorDrag=null;c.style.cursor='crosshair';const seq=++app.renderSeq;await renderPanel(pol,seq);return}if(!app.drag)return;const d=dataAt(c,e),start=app.drag.start,mode=app.mode;app.drag=null;if(mode==='pan'){renderAll();pollSpectrum(true);return}if(Math.abs(d.x-start.x)<3||Math.abs(d.y-start.y)<3){renderAll();return}await action({action:'edit',mode,pol,both:$('#both').checked,f0:start.f,f1:d.f,t0:start.t,t1:d.t})});
  c.addEventListener('wheel',e=>{if(!app.state?.ready||(!e.altKey&&!e.shiftKey))return;e.preventDefault();const d=dataAt(c,e),delta=e.deltaY||e.deltaX,factor=delta>0?1.22:.82,vertical=e.shiftKey;if(vertical){const span=(app.view.t1-app.view.t0)*factor,ratio=(d.t-app.view.t0)/(app.view.t1-app.view.t0);app.view.t0=d.t-ratio*span;app.view.t1=app.view.t0+span}else{const span=(app.view.f1-app.view.f0)*factor,ratio=(d.f-app.view.f0)/(app.view.f1-app.view.f0);app.view.f0=d.f-ratio*span;app.view.f1=app.view.f0+span}clampView();renderAll();pollSpectrum(true)},{passive:false});
});
$('#spectrum').addEventListener('mousemove',e=>{if(!app.state?.ready)return;const c=$('#spectrum'),r=c.getBoundingClientRect(),dpr=c.width/r.width,p={x:PAD.l*dpr,w:c.width-(PAD.l+PAD.r)*dpr},x=(e.clientX-r.left)*dpr,f=app.view.f0+(x-p.x)/p.w*(app.view.f1-app.view.f0);if(x>=p.x&&x<=p.x+p.w)$('#coord').textContent=`${nice(f,4)} MHz · mean spectrum`});
$('#spectrum').addEventListener('click',e=>{if(!app.state?.ready)return;const c=$('#spectrum'),r=c.getBoundingClientRect(),dpr=c.width/r.width,p={x:PAD.l*dpr,y:21*dpr,w:c.width-(PAD.l+PAD.r)*dpr,h:c.height-47*dpr},x=(e.clientX-r.left)*dpr,y=(e.clientY-r.top)*dpr;if(x<p.x||x>p.x+p.w||y<p.y||y>p.y+p.h)return;const requested=app.view.f0+(x-p.x)/p.w*(app.view.f1-app.view.f0),origin=app.state.frequency_range[0],step=Math.abs(app.state.frequency_step_mhz||((app.state.frequency_range[1]-origin)/(app.state.shape[1]-1))),index=Math.max(0,Math.min(app.state.shape[1]-1,Math.round((requested-origin)/step)));app.referenceFrequency=origin+index*step;$('#coord').textContent=`参考 channel ${index} · ${nice(app.referenceFrequency,4)} MHz`;canvases.forEach((_,pol)=>drawPanel(pol));if(app.spectrumData)drawSpectrum(app.spectrumData)});
$('#spectrum').addEventListener('wheel',e=>{if(!app.state?.ready||!e.altKey)return;e.preventDefault();const c=$('#spectrum'),r=c.getBoundingClientRect(),dpr=c.width/r.width,p={x:PAD.l*dpr,w:c.width-(PAD.l+PAD.r)*dpr},x=(e.clientX-r.left)*dpr;if(x<p.x||x>p.x+p.w)return;const f=app.view.f0+(x-p.x)/p.w*(app.view.f1-app.view.f0),delta=e.deltaY||e.deltaX,factor=delta>0?1.22:.82,span=(app.view.f1-app.view.f0)*factor,ratio=(f-app.view.f0)/(app.view.f1-app.view.f0);app.view.f0=f-ratio*span;app.view.f1=app.view.f0+span;clampView();renderAll();pollSpectrum(true)},{passive:false});
function clampView(){const s=app.state,fw=s.frequency_range[1]-s.frequency_range[0],tw=s.shape[0],w=Math.min(fw,Math.max(fw/2000,app.view.f1-app.view.f0)),h=Math.min(tw,Math.max(2,app.view.t1-app.view.t0));app.view.f0=Math.max(s.frequency_range[0],Math.min(app.view.f0,s.frequency_range[1]-w));app.view.f1=app.view.f0+w;app.view.t0=Math.max(0,Math.min(app.view.t0,tw-h));app.view.t1=app.view.t0+h}
addEventListener('keydown',e=>{if(e.target.matches('input,select'))return;const k=e.key.toLowerCase();if('ftbdg'.includes(k))setMode({f:'frequency',t:'time',b:'box',d:'delete',g:'pan'}[k]);if(k==='u')$('#undo').click();if(k==='s'){$('#save').click();e.preventDefault()}if(k==='0')$('#reset').click()});
new ResizeObserver(()=>{if(app.state?.ready){renderAll();pollSpectrum()}}).observe($('.main'));poll();
